info:
  name: price-list
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseURL}}/inventory/price-list?page=1&pageSize=20"
  params:
    - name: page
      value: "1"
      type: query
    - name: pageSize
      value: "20"
      type: query
    - name: search
      value: amoxil
      type: query
      disabled: true
    - name: pricesMissing
      value: "true"
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Price List

  Returns every drug with its selling prices and the cost range of the stock on hand, for the Price List screen.

  ## Authorization

  Requires an authenticated user with an active workspace membership. Every role can view prices; only owners and admins can change them (`PATCH /inventory/drugs/:drugId`).

  ## Query Parameters

  | Parameter | Type | Required | Description |
  |-----------|------|----------|-------------|
  | `search` | string | No | Case-insensitive match on the drug's names and details. |
  | `pricesMissing` | boolean string | No | `true` returns only drugs with no retail price. |
  | `page` | integer | No | One-based page number. |
  | `pageSize` | integer | No | Rows per page from `1` to `100`. |

  ## Success Response

  **`200 OK`**

  ```json
  {
    "status": "success",
    "message": "Price list retrieved successfully",
    "data": {
      "rows": [
        {
          "drug": {
            "id": "drug-uuid",
            "name": "Amoxil",
            "genericName": "Amoxicillin",
            "strength": "500mg",
            "form": "Capsule",
            "unit": "Pack",
            "isActive": true,
            "lowStockThreshold": 50,
            "retailPrice": 500,
            "wholesalePrice": 400
          },
          "costRange": { "lowest": 300, "highest": 320 },
          "uncostedBatchCount": 1
        }
      ],
      "pagination": { "page": 1, "pageCount": 1, "pageSize": 20, "total": 1 }
    }
  }
  ```

  ## Notes

  - All amounts are naira per counting unit (`drug.unit`).
  - `costRange` covers usable (non-expired) batches with a recorded cost. Deliveries can differ, so it is a range; it is `null` when none has a cost.
  - `uncostedBatchCount` counts usable batches with no cost price.
  - Missing selling prices are `null`, never `0`.

  ## Errors

  | Status | Description |
  |--------|-------------|
  | `401 Unauthorized` | Authentication is invalid or workspace access is suspended. |
  | `422 Unprocessable Entity` | A query parameter is invalid. |
