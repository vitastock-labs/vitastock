services:
   vitastock-postgres-db:
      image: postgres:18-alpine
      container_name: vitastock-postgres-db
      restart: unless-stopped
      env_file:
         - ./apps/backend/.env
      environment:
         POSTGRES_USER: postgres
         POSTGRES_PASSWORD: postgres
         POSTGRES_DB: vitastock
      ports:
         - "5433:5432"
      volumes:
         - vitastock-postgres-db-data:/var/lib/postgresql
      networks:
         - vitastock-network
      healthcheck:
         test: [CMD-SHELL, pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB]
         interval: 10s
         timeout: 5s
         retries: 3
         start_period: 10s

   vitastock-postgres-test-db:
      image: postgres:18-alpine
      container_name: vitastock-postgres-test-db
      profiles: [test]
      environment:
         POSTGRES_USER: postgres
         POSTGRES_PASSWORD: postgres
         POSTGRES_DB: vitastock_test
      ports:
         - "5434:5432"
      tmpfs:
         - /var/lib/postgresql
      networks:
         - vitastock-network
      healthcheck:
         test: [CMD-SHELL, pg_isready -U postgres -d vitastock_test]
         interval: 5s
         timeout: 5s
         retries: 5
         start_period: 5s

   vitastock-db-setup:
      build:
         context: .
         dockerfile: packages/db/Dockerfile
      container_name: vitastock-db-setup
      depends_on:
         vitastock-postgres-db:
            condition: service_healthy
      env_file:
         - ./apps/backend/.env
      environment:
         - DATABASE_URL_DEV=postgresql://postgres:postgres@vitastock-postgres-db:5432/vitastock
      networks:
         - vitastock-network
      restart: no

   vitastock-test-db-setup:
      build:
         context: .
         dockerfile: packages/db/Dockerfile
      container_name: vitastock-test-db-setup
      profiles: [test]
      depends_on:
         vitastock-postgres-test-db:
            condition: service_healthy
      environment:
         NODE_ENV: test
         DB_MIGRATING: "true"
         DATABASE_URL: postgresql://postgres:postgres@vitastock-postgres-test-db:5432/vitastock_test
         DATABASE_URL_DEV: postgresql://postgres:postgres@vitastock-postgres-db:5432/vitastock
         DATABASE_URL_TEST: postgresql://postgres:postgres@vitastock-postgres-test-db:5432/vitastock_test
      command: ./node_modules/.bin/drizzle-kit migrate
      networks:
         - vitastock-network
      restart: no

   vitastock-redis-cache:
      image: redis:8-alpine
      container_name: vitastock-redis-cache
      restart: unless-stopped
      ports:
         - 6381:6379
      command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
      networks:
         - vitastock-network
      healthcheck:
         test: [CMD, redis-cli, ping]
         interval: 10s
         timeout: 5s
         retries: 3
         start_period: 5s

   vitastock-redis-queue:
      image: redis:8-alpine
      container_name: vitastock-redis-queue
      restart: unless-stopped
      ports:
         - 6382:6379
      command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
      volumes:
         - vitastock-redis-queue-data:/data
      networks:
         - vitastock-network
      healthcheck:
         test: [CMD, redis-cli, ping]
         interval: 10s
         timeout: 5s
         retries: 3
         start_period: 5s

   vitastock-backend:
      image: vitastock-backend:local
      build:
         context: .
         dockerfile: apps/backend/Dockerfile
      container_name: vitastock-backend
      init: true
      restart: unless-stopped
      stop_grace_period: 20s
      depends_on:
         vitastock-postgres-db:
            condition: service_healthy
         vitastock-redis-cache:
            condition: service_healthy
         vitastock-redis-queue:
            condition: service_healthy
         vitastock-db-setup:
            condition: service_completed_successfully
      networks:
         - vitastock-network
      ports:
         - 8000:8000
      env_file:
         - ./apps/backend/.env
      environment:
         - DATABASE_URL_DEV=postgresql://postgres:postgres@vitastock-postgres-db:5432/vitastock
         - REDIS_CACHE_URL_DEV=redis://vitastock-redis-cache:6379
         - REDIS_QUEUE_URL_DEV=redis://vitastock-redis-queue:6379

      healthcheck:
         test:
            - CMD-SHELL
            - >-
               node -e "fetch('http://localhost:8000/health').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"
         interval: 30s
         timeout: 3s
         start_period: 10s
         retries: 3

   vitastock-worker:
      image: vitastock-backend:local
      build:
         context: .
         dockerfile: apps/backend/Dockerfile
      container_name: vitastock-worker
      init: true
      restart: unless-stopped
      stop_grace_period: 20s
      healthcheck:
         disable: true
      command: pnpm start:worker
      depends_on:
         vitastock-postgres-db:
            condition: service_healthy
         vitastock-redis-queue:
            condition: service_healthy
         vitastock-db-setup:
            condition: service_completed_successfully
      networks:
         - vitastock-network
      env_file:
         - ./apps/backend/.env
      environment:
         PROCESS_TYPE: worker
         DATABASE_URL_DEV: postgresql://postgres:postgres@vitastock-postgres-db:5432/vitastock
         REDIS_CACHE_URL_DEV: redis://vitastock-redis-cache:6379
         REDIS_QUEUE_URL_DEV: redis://vitastock-redis-queue:6379

volumes:
   vitastock-postgres-db-data:
   vitastock-redis-queue-data:

networks:
   vitastock-network:
      driver: bridge
