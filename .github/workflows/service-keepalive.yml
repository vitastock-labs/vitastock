name: Service Keepalive

on:
   schedule:
      - cron: "17 9 15 * *"
        timezone: Africa/Lagos
   workflow_dispatch:

permissions:
   contents: read

jobs:
   keep-services-alive:
      runs-on: ubuntu-latest
      steps:
         - name: Checkout code
           uses: actions/checkout@v6

         - name: Setup pnpm
           uses: pnpm/action-setup@v5
           with:
              version: 11.22.0

         - name: Setup Node.js
           uses: actions/setup-node@v6
           with:
              node-version: lts/*
              cache: pnpm

         - name: Install dependencies
           run: pnpm install --frozen-lockfile

         - name: Keep Brevo and Redis alive
           working-directory: apps/backend
           env:
              BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
              REDIS_CACHE_URL: ${{ secrets.REDIS_CACHE_URL }}
              REDIS_QUEUE_URL: ${{ secrets.REDIS_QUEUE_URL }}
           run: pnpm maintenance:keepalive
